<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-label="Mohamed Elnady - Footer">
  <defs>
    <!-- Background Seamless Alpha Mask (Fades in from top and out at bottom) -->
    <linearGradient id="footer-alpha-mask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <mask id="footer-seamless-mask">
      <rect width="1200" height="130" fill="url(#footer-alpha-mask)" />
    </mask>

    <!-- Background Gradient -->
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <!-- Top Laser Divider Gradient (Softly Faded at tips) -->
    <linearGradient id="footer-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0" />
      <stop offset="25%" stop-color="#61DAFB" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#0A66C2" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0" />
    </linearGradient>

    <!-- Badge Gradients -->
    <linearGradient id="footer-badge-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="footer-badge-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.6" />
    </linearGradient>

    <!-- Text Metallic Gradient -->
    <linearGradient id="footer-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2F5FE" />
      <stop offset="70%" stop-color="#61DAFB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="footer-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#61DAFB" stroke-width="0.5" stroke-opacity="0.07" />
      <circle cx="40" cy="0" r="1" fill="#61DAFB" fill-opacity="0.2" />
    </pattern>

    <!-- Ambient Spotlights -->
    <radialGradient id="footer-glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20" />
      <stop offset="60%" stop-color="#0A66C2" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="footer-neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Keyframe Animations -->
    <style>
      @keyframes footerPulse {
        0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 10px rgba(97, 218, 251, 0.4)); }
        50% { opacity: 0.95; filter: drop-shadow(0 0 18px rgba(97, 218, 251, 0.75)); }
      }
      @keyframes footerTwinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 0.85; transform: scale(1.3); }
      }
      @keyframes floatGentle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }

      .footer-badge { animation: floatGentle 4s ease-in-out infinite; }
      .footer-star-1 { animation: footerTwinkle 3s ease-in-out infinite; }
      .footer-star-2 { animation: footerTwinkle 4s ease-in-out 1.5s infinite; }
      .motto-glow { animation: footerPulse 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- 1. Background Layers (Faded via Alpha Mask) -->
  <g mask="url(#footer-seamless-mask)">
    <rect width="1200" height="130" fill="url(#footer-bg)" />
    <rect width="1200" height="130" fill="url(#footer-glow)" />
    <rect width="1200" height="130" fill="url(#footer-grid)" opacity="0.7" />
  </g>

  <!-- 2. Soft Ambient Horizon Glow Line -->
  <line x1="120" y1="12" x2="1080" y2="12" stroke="url(#footer-laser)" stroke-width="2" filter="url(#footer-neon-glow)" />
  <circle cx="600" cy="12" r="3" fill="#61DAFB" filter="url(#footer-neon-glow)" />

  <!-- 3. Ambient Twinkling Stars -->
  <g fill="#61DAFB">
    <circle class="footer-star-1" cx="240" cy="40" r="1.5" />
    <circle class="footer-star-2" cx="380" cy="85" r="1.2" opacity="0.6" />
    <circle class="footer-star-1" cx="820" cy="35" r="1.4" />
    <circle class="footer-star-2" cx="960" cy="75" r="1.6" fill="#38BDF8" />
    <circle class="footer-star-1" cx="150" cy="70" r="1.2" fill="#FFFFFF" />
    <circle class="footer-star-2" cx="1050" cy="45" r="1.3" />
  </g>

  <!-- 4. Left & Right Symmetric Cyber Brackets -->
  <g opacity="0.45" stroke="url(#footer-badge-stroke)" stroke-width="1.2" fill="none">
    <path d="M 280 46 L 250 46 L 235 65 L 250 84 L 280 84" />
    <circle cx="280" cy="65" r="2" fill="#61DAFB" />
    <path d="M 920 46 L 950 46 L 965 65 L 950 84 L 920 84" />
    <circle cx="920" cy="65" r="2" fill="#61DAFB" />
  </g>

  <!-- 5. Centered Engineering Motto Badge -->
  <g class="footer-badge" transform="translate(600, 65)">
    <!-- Motto Capsule -->
    <rect class="motto-glow" x="-230" y="-22" width="460" height="44" rx="22" fill="url(#footer-badge-bg)" stroke="url(#footer-badge-stroke)" stroke-width="1.4" />
    
    <!-- Motto Text -->
    <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="url(#footer-text-grad)" letter-spacing="2.4" text-anchor="middle">
      ⚡ SHIP FAST <tspan fill="#61DAFB">·</tspan> FEEL NATIVE <tspan fill="#61DAFB">·</tspan> SCALE CLEAN ⚡
    </text>
  </g>

  <!-- 6. Bottom Micro Tagline -->
  <text x="600" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B" letter-spacing="1" text-anchor="middle">
    CRAFTING HIGH-PERFORMANCE MOBILE EXPERIENCES <tspan fill="#38BDF8">•</tspan> E-COMMERCE <tspan fill="#38BDF8">•</tspan> REAL ESTATE <tspan fill="#38BDF8">•</tspan> ON-DEMAND
  </text>
</svg>
